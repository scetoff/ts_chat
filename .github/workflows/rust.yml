name: Rust checks

on:
  pull_request:
    branches: [master]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "RUST_PORT.md"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

concurrency:
  group: rust-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Check
        run: cargo check
      - name: Unit tests
        run: cargo test
