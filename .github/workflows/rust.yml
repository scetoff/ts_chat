name: Rust checks

on:
  pull_request:
    branches: [master]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "RUST_PORT.md"
      - ".github/workflows/rust.yml"
      - ".env.example"
  workflow_dispatch:

concurrency:
  group: rust-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Check
        run: cargo check --all-targets
      - name: Unit tests
        run: cargo test
      - name: Build Windows release executable
        run: cargo build --release --bin tschat
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: tschat-windows-x64
          path: target/release/tschat.exe
          if-no-files-found: error
          retention-days: 14

  voice-build:
    needs: cargo-check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install CMake and LLVM/Clang
        shell: pwsh
        run: |
          choco install cmake llvm --yes --no-progress
          $llvmBin = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path "$llvmBin\libclang.dll")) {
            throw "libclang.dll not found under $llvmBin"
          }
          "LIBCLANG_PATH=$llvmBin" >> $env:GITHUB_ENV
          "$llvmBin" >> $env:GITHUB_PATH
      - name: Check voice feature
        run: cargo check --all-targets --features voice
      - name: Unit tests with voice feature
        run: cargo test --features voice
      - name: Build voice-enabled Windows executable
        run: cargo build --release --features voice --bin tschat
      - name: Upload voice-enabled Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: tschat-windows-x64-voice
          path: target/release/tschat.exe
          if-no-files-found: error
          retention-days: 14

  mysql-smoke:
    # Uses the configured FreeDB credentials, so run only on an explicit manual
    # dispatch to avoid competing with the desktop app for the account connection limit.
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Check whether database credentials are configured
        id: database
        env:
          TSCHAT_TEST_DATABASE_URL: ${{ secrets.TSCHAT_TEST_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
        shell: pwsh
        run: |
          $hasUrl = -not [string]::IsNullOrWhiteSpace($env:DATABASE_URL) -or -not [string]::IsNullOrWhiteSpace($env:TSCHAT_TEST_DATABASE_URL)
          $hasParts = -not [string]::IsNullOrWhiteSpace($env:DB_HOST) -and -not [string]::IsNullOrWhiteSpace($env:DB_DATABASE) -and -not [string]::IsNullOrWhiteSpace($env:DB_USERNAME)
          if ($hasUrl -or $hasParts) {
            "configured=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Database smoke test skipped: no DATABASE_URL or DB_* repository secrets are configured."
            "configured=false" >> $env:GITHUB_OUTPUT
          }
      - name: Checkout
        if: steps.database.outputs.configured == 'true'
        uses: actions/checkout@v4
      - name: Install stable Rust
        if: steps.database.outputs.configured == 'true'
        uses: dtolnay/rust-toolchain@stable
      - name: Read-only TSchat MySQL schema check
        if: steps.database.outputs.configured == 'true'
        env:
          TSCHAT_TEST_DATABASE_URL: ${{ secrets.TSCHAT_TEST_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        shell: pwsh
        run: cargo run --bin db_smoke

  mysql-mutating:
    needs: cargo-check
    # Mutating tests run only on same-repository PRs/manual dispatch and only
    # when a dedicated disposable-database secret has been configured.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: windows-latest
    steps:
      - name: Check whether the dedicated disposable database is configured
        id: database
        env:
          TSCHAT_MUTATING_TEST_DATABASE_URL: ${{ secrets.TSCHAT_MUTATING_TEST_DATABASE_URL }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TSCHAT_MUTATING_TEST_DATABASE_URL)) {
            Write-Host "Mutating MySQL integration tests skipped: configure the dedicated TSCHAT_MUTATING_TEST_DATABASE_URL secret."
            "configured=false" >> $env:GITHUB_OUTPUT
          } else {
            "configured=true" >> $env:GITHUB_OUTPUT
          }
      - name: Checkout
        if: steps.database.outputs.configured == 'true'
        uses: actions/checkout@v4
      - name: Install stable Rust
        if: steps.database.outputs.configured == 'true'
        uses: dtolnay/rust-toolchain@stable
      - name: Run guarded mutating MySQL integration test
        if: steps.database.outputs.configured == 'true'
        env:
          TSCHAT_ALLOW_MUTATING_TESTS: YES
          TSCHAT_MUTATING_TEST_DATABASE_URL: ${{ secrets.TSCHAT_MUTATING_TEST_DATABASE_URL }}
        run: cargo test --bin tschat mutating_mysql_flows_use_isolated_disposable_database
